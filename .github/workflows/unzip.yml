name: Import and flatten launcher ZIP

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: ZIP file name
        required: true
        default: InnovationLauncher.zip
      release_tag:
        description: '匯入後要發佈的版本標籤（例如 v1.3.1）。留空就只匯入並編譯、不發佈'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and flatten project
        shell: bash
        env:
          ZIP_NAME: ${{ inputs.zip_name }}
        run: |
          set -euo pipefail

          if [ ! -f "$ZIP_NAME" ]; then
            echo "找不到 ZIP：$ZIP_NAME"
            exit 1
          fi

          rm -rf /tmp/innovation-import
          mkdir -p /tmp/innovation-import
          unzip -q -o "$ZIP_NAME" -d /tmp/innovation-import

          SOURCE="/tmp/innovation-import"

          if [ -d "$SOURCE/InnovationLauncher" ]; then
            SOURCE="$SOURCE/InnovationLauncher"
          else
            DIR_COUNT=$(find "$SOURCE" -mindepth 1 -maxdepth 1 -type d | wc -l)
            FILE_COUNT=$(find "$SOURCE" -mindepth 1 -maxdepth 1 -type f | wc -l)

            if [ "$DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
              SOURCE=$(find "$SOURCE" -mindepth 1 -maxdepth 1 -type d)
            fi
          fi

          echo "專案來源：$SOURCE"

          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .github \
            ! -name "$ZIP_NAME" \
            -exec rm -rf {} +

          rm -rf "$SOURCE/.github"
          cp -a "$SOURCE/." .

          rm -rf /tmp/innovation-import
          rm -f "$ZIP_NAME"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "沒有變更，略過 commit"
          else
            git diff --cached --stat
            git commit -m "Import and flatten new launcher release"
            git push
          fi

      # 用 GITHUB_TOKEN 推送的 commit 不會自動觸發別的 workflow（GitHub 的防迴圈規則），
      # 但「手動觸發 workflow_dispatch」是例外，所以在這裡接著啟動 Build and Release。
      - name: Start Build and Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            gh workflow run build.yml --ref "${{ github.ref_name }}" -f release_tag="$RELEASE_TAG"
          else
            gh workflow run build.yml --ref "${{ github.ref_name }}"
          fi
