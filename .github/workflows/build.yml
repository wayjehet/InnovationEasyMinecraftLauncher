name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained package
        run: dotnet publish src/IEML.App/IEML.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: InnovationEasyMinecraftLauncher
          path: dist/

      - name: Create ZIP package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath InnovationEasyMinecraftLauncher-${{ github.ref_name }}-NET8-SelfContained.zip -CompressionLevel Optimal

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          $zip = "InnovationEasyMinecraftLauncher-$tag-NET8-SelfContained.zip"
          $sha = "$zip.sha256"

          if (Test-Path $zip) {
            Get-FileHash -Algorithm SHA256 $zip | ForEach-Object { $_.Hash.ToLower() + "  " + $zip } | Set-Content -Encoding ascii $sha
          }

          if (gh release view $tag 2>$null) {
            gh release upload $tag $zip --clobber
            if (Test-Path $sha) { gh release upload $tag $sha --clobber }
          } else {
            gh release create $tag $zip $(if (Test-Path $sha) { $sha }) --title "Innovation Easy Minecraft Launcher $tag" --notes "Windows x64 自包含版本，已包含 .NET 8 Runtime。解壓縮後執行 InnovationEasyMinecraftLauncher.exe。"
          }
