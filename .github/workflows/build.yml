name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained package
        run: dotnet publish src/IEML.App/IEML.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: InnovationEasyMinecraftLauncher
          path: dist/

      - name: Create ZIP package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath InnovationEasyMinecraftLauncher-${{ github.ref_name }}-NET8-SelfContained.zip -CompressionLevel Optimal

      - name: Checksum and signature (for auto-update)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          $zip = "InnovationEasyMinecraftLauncher-${{ github.ref_name }}-NET8-SelfContained.zip"
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "$zip.sha256"
          if ($env:UPDATE_SIGNING_KEY) {
            $ecdsa = [System.Security.Cryptography.ECDsa]::Create()
            $ecdsa.ImportFromPem($env:UPDATE_SIGNING_KEY)
            $bytes = [System.IO.File]::ReadAllBytes($zip)
            $sig = $ecdsa.SignData($bytes, [System.Security.Cryptography.HashAlgorithmName]::SHA256, [System.Security.Cryptography.DSASignatureFormat]::Rfc3279DerSequence)
            [System.IO.File]::WriteAllBytes("$zip.sig", $sig)
          } else { Write-Host "UPDATE_SIGNING_KEY not set; skipping signature." }

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = "InnovationEasyMinecraftLauncher-${{ github.ref_name }}-NET8-SelfContained.zip"
          $files = @($zip, "$zip.sha256")
          if (Test-Path "$zip.sig") { $files += "$zip.sig" }
          gh release create "${{ github.ref_name }}" @files --title "Innovation Easy Minecraft Launcher ${{ github.ref_name }}" --notes "Windows x64 自包含版本，已包含 .NET 8 Runtime。解壓縮後執行 InnovationEasyMinecraftLauncher.exe。"
