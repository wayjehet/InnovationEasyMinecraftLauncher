<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IEML UI 預覽</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
<style>
:root{--bg:#0F0F0F;--panel:#1C1C1C;--line:#333;--accent:#00FFFF;--icon:#cfcfcf;--on:#0F0F0F;--text:#ececec;--mute:#8a8a8a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#080808;color:var(--text);font:13px/1.45 "Microsoft JhengHei","PingFang TC",system-ui,sans-serif}
#note{padding:8px 12px;color:var(--mute);font-size:12px}
#wrap{overflow:auto;padding:0 8px 16px}
#win{width:980px;height:640px;transform-origin:0 0;border:1px solid var(--line);border-radius:6px;overflow:hidden;position:relative;
background:linear-gradient(135deg,#0F1F1A,#12302A 50%,#0F0F0F)}
#frame{position:absolute;inset:14px;border:1px solid var(--line);border-radius:8px;background:rgba(28,28,28,.82);display:grid;grid-template-columns:311fr 551fr 117fr}
.col{min-width:0;min-height:0;padding:16px;position:relative}
.col+.col{border-left:1px solid var(--line)}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--accent);color:var(--on);border:0;border-radius:5px;padding:8px 14px;font-weight:700;cursor:pointer;transition:.15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 12px var(--accent)}
.btn.sm{padding:5px 10px;font-size:12px}
.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:5px;padding:8px 12px;cursor:pointer}
.ghost:hover{border-color:var(--accent);box-shadow:0 0 8px rgba(0,255,255,.25)}
.ghost.on{border-color:var(--accent);color:var(--accent)}
select,input[type=text]{background:#141414;border:1px solid var(--line);border-radius:5px;padding:7px 8px;width:100%}
label{display:block;color:var(--mute);margin:10px 0 4px;font-size:12px}
.logo{font-weight:800;font-size:20px;letter-spacing:2px}.logo b{color:var(--accent)}
.av{width:56px;height:56px;border-radius:50%;background:#26332f;border:2px solid var(--accent);display:grid;place-items:center;font-weight:800;font-size:22px;cursor:pointer}
.bar{height:6px;background:#2a2a2a;border-radius:3px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.nav{display:flex;flex-direction:column;gap:6px}
.nv{background:none;border:0;border-left:3px solid transparent;color:var(--icon);padding:10px 4px;text-align:center;cursor:pointer;font-size:12px}
.nv svg{display:block;margin:0 auto 3px;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nv:hover,.nv.on{color:var(--accent);border-left-color:var(--accent);background:rgba(0,255,255,.06)}
#stage{position:absolute;inset:16px;overflow:hidden}
.card{position:absolute;width:210px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;touch-action:none;user-select:none}
.card:hover{border-color:var(--accent);box-shadow:0 0 10px rgba(0,255,255,.2)}
.card .h{display:flex;gap:8px;align-items:center;cursor:grab;margin-bottom:8px}
.card .h .s{width:30px;height:30px;border-radius:50%;background:#26332f;display:grid;place-items:center;font-weight:700;flex:none}
.card .h div{min-width:0}.card .h b,.card .h span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .h span{color:var(--mute);font-size:12px}
.card .r{display:flex;gap:6px}.card .r button{flex:1}
.empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:var(--mute);gap:12px}
.pg{position:absolute;inset:0;padding:16px;overflow:auto}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}.top h3{margin:0;font-size:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.list{border:1px solid var(--line);border-radius:6px;max-height:300px;overflow:auto}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.it:last-child{border:0}.it:hover{background:rgba(255,255,255,.04)}.it.on{background:rgba(0,255,255,.1)}
.it small{color:var(--mute);display:block}
.sw{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sw i{width:24px;height:24px;border-radius:5px;border:1px solid #555;cursor:pointer}
.sw input{width:34px;height:26px;padding:0;border:0;background:none}
.tag{font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
#toast{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);max-width:80%;text-align:center;background:var(--accent);color:var(--on);padding:8px 16px;border-radius:6px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:9}
#toast.s{opacity:1}
.cr{color:var(--mute);font-size:11px;border-top:1px solid var(--line);padding-top:8px;margin-top:12px}
@keyframes pgin{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(10px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes glow{0%,100%{box-shadow:0 0 0 rgba(0,255,255,0)}50%{box-shadow:0 0 16px var(--accent)}}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
#frame{animation:rise .5s ease-out backwards}
.pg{animation:pgin .25s ease-out}
.card{animation:pop .35s cubic-bezier(.2,.9,.3,1.2) backwards;transition:box-shadow .15s,border-color .15s,transform .15s}
.card:nth-child(2){animation-delay:.07s}.card:nth-child(3){animation-delay:.14s}.card:nth-child(4){animation-delay:.21s}
.card.dg{transform:scale(1.04) rotate(-1deg);box-shadow:0 10px 24px rgba(0,0,0,.5),0 0 14px rgba(0,255,255,.3);cursor:grabbing;transition:none}
.it{animation:rise .3s ease-out backwards}
.it:nth-child(2){animation-delay:.04s}.it:nth-child(3){animation-delay:.08s}.it:nth-child(4){animation-delay:.12s}.it:nth-child(5){animation-delay:.16s}.it:nth-child(n+6){animation-delay:.2s}
.btn:active,.ghost:active{transform:scale(.96)}
.nv{transition:color .15s,background .15s,border-color .15s}.nv svg{transition:transform .2s}.nv:hover svg,.nv.on svg{transform:scale(1.15)}
.bar i.run{background:linear-gradient(90deg,var(--accent),#fff,var(--accent));background-size:200% 100%;animation:shim 1.2s linear infinite}
#launch.busy{animation:glow 1s ease-in-out infinite}
.empty{animation:rise .4s}.empty>div:first-child{animation:flt 3s ease-in-out infinite}
.av{transition:transform .2s}.av:hover{transform:scale(1.08) rotate(-4deg)}
#toast{transform:translate(-50%,12px)}#toast.s{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="note">這是 IEML 主畫面的互動預覽（只是示意，不是 WPF）。卡片可拖動；點右欄切換頁面，再點一次返回。手機可左右滑動。</div>
<div id="wrap"><div id="win">
<div id="frame">
 <div class="col" id="left">
  <div class="logo">I<b>E</b>ML <span class="tag">Beta</span></div>
  <div style="display:flex;gap:12px;align-items:center;margin:14px 0">
   <div class="av" id="av" title="開啟帳號管理">T</div>
   <div style="min-width:0"><b id="iname" style="font-size:15px">NeoForge 1.21.1 Test</b><div id="imeta" style="color:var(--mute)">1.21.1 · NeoForge</div></div>
  </div>
  <label>使用帳號</label>
  <select id="acc"><option>TestPlayer（離線）</option><option>Steve（正版）</option><option>Alex（正版）</option></select>
  <div style="margin-top:22px"><div id="st" style="color:var(--mute);min-height:20px">待命</div><div class="bar"><i id="pb"></i></div></div>
  <button class="btn" id="launch" style="width:100%;padding:12px;font-size:15px;margin-top:6px">啟動</button>
  <div class="row" style="margin-top:10px"><button class="ghost" data-t="實例設置（預覽）">實例設置</button><button class="ghost" data-t="實例選擇（預覽）">實例選擇</button></div>
 </div>
 <div class="col" id="mid" style="padding:0"><div id="stage"></div></div>
 <div class="col nav" id="nav" style="padding:12px 6px"></div>
</div>
<div id="toast"></div>
</div></div>
<script>
const $=s=>document.querySelector(s),root=document.documentElement;
let page='home',nid=4,zTop=5,s=1,inst='NeoForge 1.21.1 Test';
const cards=[{id:1,n:'NeoForge 1.21.1 Test',a:'TestPlayer',x:24,y:30},{id:2,n:'Fabric 1.20.1 生存',a:'Steve',x:268,y:44},{id:3,n:'Vanilla 1.21',a:'Alex',x:146,y:190}];
const ico={settings:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
download:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',p2p:'<circle cx="6" cy="12" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="M8.7 10.5l6.6-3M8.7 13.5l6.6 3"/>',
more:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',music:'<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>'};
const names={settings:'設置',download:'下載',p2p:'P2P',more:'更多',music:'音樂'};
$('#nav').innerHTML=Object.keys(names).map(k=>`<button class="nv" data-p="${k}"><svg viewBox="0 0 24 24">${ico[k]}</svg>${names[k]}</button>`).join('');
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('s');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('s'),1600)}
function fit(){s=Math.max(.6,Math.min(1,(innerWidth-16)/980));const w=$('#win');w.style.transform=`scale(${s})`;$('#wrap').style.height=(640*s+24)+'px'}
addEventListener('resize',fit);fit();
document.addEventListener('click',e=>{const t=e.target.closest('[data-t]');if(t)toast(t.dataset.t)});
$('#av').onclick=()=>toast('帳號管理（預覽）');
$('#nav').onclick=e=>{const b=e.target.closest('.nv');if(!b)return;go(page===b.dataset.p?'home':b.dataset.p)};
function go(p){page=p;D.open=null;document.querySelectorAll('.nv').forEach(b=>b.classList.toggle('on',b.dataset.p===p));render()}
function head(t){return `<div class="top"><button class="ghost" onclick="go('home')">← 返回</button><h3>${t}</h3></div>`}
function render(){const st=$('#stage');
 if(page==='home')return home();
 const f={settings:pSettings,download:pDownload,p2p:pP2P,more:pMore,music:pMusic,card:pCard}[page];
 st.innerHTML=`<div class="pg">${f()}</div>`;if(page==='settings')bindColors();if(page==='download')bindDl()}
function home(){const st=$('#stage');
 st.innerHTML=cards.length?cards.map(cardHtml).join('')+`<button class="ghost" style="position:absolute;right:10px;bottom:10px" onclick="addCard()">＋ 新增卡片</button>`
 :`<div class="empty"><div style="font-size:15px">還沒有快捷啟動卡片</div><button class="btn" onclick="addCard()">＋ 新增卡片</button></div>`;
 st.querySelectorAll('.card').forEach(drag)}
function cardHtml(c){return `<div class="card" data-id="${c.id}" style="left:${c.x}px;top:${c.y}px;z-index:${c.z||1}"><div class="h"><div class="s">${c.a[0]}</div><div><b>${c.n}</b><span>${c.a}</span></div></div><div class="r"><button class="btn sm" data-run="${c.id}">啟動</button><button class="ghost sm" style="padding:5px 10px" data-cs="${c.id}">設置</button></div></div>`}
function addCard(){cards.push({id:nid++,n:inst,a:'TestPlayer',x:40+cards.length*14,y:60+cards.length*14});home()}
function drag(el){const c=cards.find(x=>x.id==el.dataset.id);
 el.onpointerdown=e=>{if(e.target.closest('button'))return;el.classList.add('dg');c.z=++zTop;el.style.zIndex=c.z;const sx=e.clientX,sy=e.clientY,ox=c.x,oy=c.y;el.setPointerCapture(e.pointerId);
  el.onpointermove=m=>{const W=$('#stage').clientWidth-el.offsetWidth,H=$('#stage').clientHeight-el.offsetHeight;c.x=Math.max(0,Math.min(W,ox+(m.clientX-sx)/s));c.y=Math.max(0,Math.min(H,oy+(m.clientY-sy)/s));el.style.left=c.x+'px';el.style.top=c.y+'px'};
  el.onpointerup=()=>{el.classList.remove('dg');el.onpointermove=el.onpointerup=null}}}
$('#stage').addEventListener('click',e=>{const r=e.target.closest('[data-run]'),g=e.target.closest('[data-cs]');
 if(r){const c=cards.find(x=>x.id==r.dataset.run);run(`${c.n} · ${c.a}`)}
 if(g){cur=cards.find(x=>x.id==g.dataset.cs);page='card';document.querySelectorAll('.nv').forEach(b=>b.classList.remove('on'));render()}});
let cur=null;
function run(t){const pb=$('#pb'),sx=$('#st');let p=0;sx.textContent='啟動：'+t;pb.classList.add('run');$('#launch').classList.add('busy');clearInterval(run.h);run.h=setInterval(()=>{p+=8;pb.style.width=Math.min(p,100)+'%';
 sx.textContent=p<40?'下載資源…':p<80?'安裝載入器…':p<100?'驗證帳號…':'已啟動（PID 16828）';if(p>=100){clearInterval(run.h);pb.classList.remove('run');$('#launch').classList.remove('busy')}},180)}
$('#launch').onclick=()=>run(inst+' · '+$('#acc').value);
function pCard(){return head('卡片設置')+`<label>實例</label><select>${['NeoForge 1.21.1 Test','Fabric 1.20.1 生存','Vanilla 1.21'].map(n=>`<option ${n===cur.n?'selected':''}>${n}</option>`).join('')}</select><label>帳號</label><select>${['TestPlayer','Steve','Alex'].map(n=>`<option ${n===cur.a?'selected':''}>${n}</option>`).join('')}</select>
<div class="row" style="margin-top:16px"><button class="btn" data-t="已儲存（預覽）">儲存</button><button class="ghost" style="color:#ff7b7b" onclick="cards.splice(cards.indexOf(cur),1);go('home')">刪除卡片</button></div>`}
const SW=['#00FFFF','#7CFF6B','#FFB020','#FF5C8A','#8B7CFF','#FFFFFF'],defs={'--accent':'#00FFFF','--icon':'#cfcfcf','--line':'#333333'};
function pSettings(){const g=(k,t)=>`<label>${t}</label><div class="sw" data-k="${k}">${SW.map(c=>`<i style="background:${c}" data-c="${c}"></i>`).join('')}<input type="color" value="${getComputedStyle(root).getPropertyValue(k).trim()}"></div>`;
 return head('設置')+`<b>顏色</b>`+g('--accent','強調色（按鈕、滑過、進度條）')+g('--icon','圖標線條色')+g('--line','外框與分隔線色')+`<div style="margin-top:14px"><button class="ghost" id="rst">恢復預設</button></div>
<label style="margin-top:18px">帳號、CurseForge 金鑰、素材資料夾、關於 Beta 也會放在這一頁（預覽省略）</label>`}
function setC(k,v){root.style.setProperty(k,v);try{const o=JSON.parse(localStorage.getItem('ieml')||'{}');o[k]=v;localStorage.setItem('ieml',JSON.stringify(o))}catch(e){}}
function bindColors(){document.querySelectorAll('.sw').forEach(w=>{w.onclick=e=>{const c=e.target.dataset.c;if(c)setC(w.dataset.k,c)};w.querySelector('input').oninput=e=>setC(w.dataset.k,e.target.value)});
 $('#rst').onclick=()=>{Object.entries(defs).forEach(([k,v])=>root.style.setProperty(k,v));try{localStorage.removeItem('ieml')}catch(e){}render()}}
try{Object.entries(JSON.parse(localStorage.getItem('ieml')||'{}')).forEach(([k,v])=>root.style.setProperty(k,v))}catch(e){}
const V=[['1.21.1','2024-08-08','r'],['1.21','2024-06-13','r'],['1.20.4','2023-12-07','r'],['1.20.1','2023-06-12','r'],['24w33a','2024-08-14','s'],['24w21b','2024-05-29','s'],['1.12.2','2017-09-18','o'],['1.8.9','2015-12-09','o'],['1.7.10','2014-06-26','o']];
const LV={Fabric:{'*':['0.16.5','0.16.4','0.15.11']},Quilt:{'*':['0.26.4','0.26.3']},Forge:{'1.21.1':['52.0.1','52.0.0'],'1.21':['51.0.33'],'1.20.4':['49.0.30'],'1.20.1':['47.3.0','47.2.0']},NeoForge:{'1.21.1':['21.1.172','21.1.100'],'1.21':['21.0.167'],'1.20.4':['20.4.237'],'1.20.1':['47.1.106']}};
const lvs=(l,v)=>{const m=LV[l];return m?(m[v]||m['*']||[]):[]};
const lds=v=>['原版',...Object.keys(LV).filter(l=>lvs(l,v).length)];
const D={tab:'game',filt:'r',ver:'1.21.1',ld:'NeoForge',lv:'21.1.172',src:'Modrinth',deps:true,fapi:true,opt:{},open:null,pv:null,vf:true};
const R={mod:[['Sodium',[],['Sodium Extra','Indium']],['Mod Menu',['Fabric API'],[]],['Roughly Enough Items',['Architectury API'],['Cloth Config API']],['Create',['Flywheel','Registrate'],['JEI']]],shader:[['BSL Shaders',['Iris Shaders'],[]],['Complementary',['Iris Shaders'],['Distant Horizons']],['Photon',['Iris Shaders'],[]]],res:[['Faithful 32x',[],[]],['Fresh Animations',['Entity Model Features'],['Entity Texture Features']],['Better Leaves',[],[]]],pack:[['Fabulously Optimized',[],[]],['Create: Above and Beyond',[],[]],['All the Mods 9',[],[]]]};
function pDownload(){const T=[['game','遊戲'],['mod','模組'],['shader','光影'],['res','資源包'],['pack','整合包'],['inst','已安裝']];
 return head('下載')+`<div class="tabs">${T.map(t=>`<button class="ghost ${D.tab===t[0]?'on':''}" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div>`+(D.tab==='game'?gameTab():D.tab==='inst'?instTab():listTab())}
function gameTab(){const old=D.filt!=='r'||false,vs=V.filter(v=>v[2]===D.filt),only=D.filt!=='r';if(only)D.ld='原版';else{const L=lds(D.ver);if(!L.includes(D.ld))D.ld=L.includes('NeoForge')?'NeoForge':'原版'}if(!lvs(D.ld,D.ver).includes(D.lv))D.lv=lvs(D.ld,D.ver)[0]||'';
 return `<div class="tabs">${[['r','正式版'],['s','快照'],['o','舊版']].map(f=>`<button class="ghost ${D.filt===f[0]?'on':''}" data-f="${f[0]}">${f[1]}</button>`).join('')}</div>
<div class="row" style="align-items:flex-start"><div class="list" style="flex:1.1">${vs.map(v=>`<div class="it ${D.ver===v[0]?'on':''}" data-v="${v[0]}"><span>${v[0]}<small>${v[1]}</small></span></div>`).join('')}</div>
<div style="flex:1"><label style="margin-top:0">實例名稱</label><input type="text" id="dn" value="${D.ver}-${D.ld}"><label>載入器${only?'（快照與舊版只能原版）':''}</label>
<select id="dl" ${only?'disabled':''}>${lds(D.ver).map(l=>`<option ${l===D.ld?'selected':''}>${l}</option>`).join('')}</select>
<label>載入器版本</label><select id="dv" ${lvs(D.ld,D.ver).length?'':'disabled'}>${lvs(D.ld,D.ver).map((v,i)=>`<option value="${v}" ${v===D.lv?'selected':''}>${v}${i===0?'（最新）':''}</option>`).join('')||'<option>—</option>'}</select>
${(D.ld==='Fabric'||D.ld==='Quilt')?`<label style="display:flex;gap:6px;align-items:center;color:var(--text);margin-top:10px"><input type="checkbox" id="fa" style="accent-color:var(--accent)" ${D.fapi?'checked':''}> 自動安裝前置：${D.ld==='Quilt'?'Quilted Fabric API':'Fabric API'}</label>`:''}
<div style="color:var(--mute);font-size:12px;margin-top:8px">將安裝：Minecraft ${D.ver}${D.ld!=='原版'?' ＋ '+D.ld+' '+D.lv:''} ＋ 對應 Java（本機沒有才下載）${(D.ld==='Fabric'||D.ld==='Quilt')&&D.fapi?' ＋ '+(D.ld==='Quilt'?'Quilted Fabric API':'Fabric API'):''}</div>
<div class="bar" style="margin-top:14px"><i id="dp"></i></div><button class="btn" id="di" style="width:100%">安裝</button></div></div>`}
const VH=[['1.21.1','release','2024-09-02'],['1.21.1','release','2024-08-11'],['1.21','beta','2024-07-02'],['1.20.4','release','2024-03-15'],['1.20.1','release','2023-09-20'],['1.20.1','alpha','2023-08-01'],['1.19.4','release','2023-05-12']];
function detail(k){const it=R[k].find(x=>x[0]===D.open),d=it[1],o=it[2]||[],pk=k==='pack',TN={release:'正式版',beta:'Beta',alpha:'Alpha'};
let vs=VH.map((h,i)=>({i,v:'v2.'+(6-i)+'.'+(i%2),mc:h[0],t:h[1],d:h[2]}));
if(D.vf)vs=vs.filter(x=>x.mc===D.ver);
if(!vs.find(x=>x.i===D.pv))D.pv=vs.length?vs[0].i:null;
const cur=vs.find(x=>x.i===D.pv);
const dep=d.map(x=>`<div class="it"><span>${x}<small>${D.deps?'將自動安裝':'不會安裝（已關閉自動安裝前置）'}</small></span><span class="tag">必要</span></div>`).join('');
const opt=o.map(x=>`<div class="it"><label style="display:flex;gap:6px;align-items:center;margin:0;color:var(--text)"><input type="checkbox" data-o="${D.open}|${x}" style="accent-color:var(--accent)" ${D.opt[D.open+'|'+x]?'checked':''}>${x}</label><span class="tag">可選</span></div>`).join('');
return `<div class="top"><button class="ghost" data-back="1">← 返回列表</button><h3>${D.open}</h3></div>
<div style="color:var(--mute);margin-bottom:6px">${D.src} · ${pk?'整合包':'作者 Example'} · 下載數 1.2M（範例資料）</div>
<div style="margin-bottom:10px">這裡會顯示專案簡介、截圖與連結。</div>
<b>版本</b>
<label style="display:flex;gap:6px;align-items:center;color:var(--text);margin:6px 0"><input type="checkbox" id="vf" style="accent-color:var(--accent)" ${D.vf?'checked':''}> 只顯示符合目前 Minecraft 版本（${D.ver}）</label>
<div class="list" style="max-height:160px">${vs.map(x=>`<div class="it ${x.i===D.pv?'on':''}" data-pv="${x.i}"><span>${x.v}<small>${TN[x.t]} · ${x.mc} · ${x.d}</small></span><span class="tag">${x.t==='release'?(x.i===vs[0].i?'最新':''):TN[x.t]}</span></div>`).join('')||'<div class="it">沒有符合的版本，請取消上方勾選查看過往版本</div>'}</div>
${!pk&&(dep||opt)?`<div style="margin-top:12px"><b>前置</b></div><div class="list" style="margin-top:6px">${dep}${opt}</div>`:''}
<button class="btn" style="width:100%;margin-top:12px" data-idet="1" ${cur?'':'disabled'}>${pk?'安裝為新實例':'安裝此版本'}${cur?'（'+cur.v+'）':''}</button>`}
function listTab(){const k=D.tab,pk=k==='pack';if(D.open)return detail(k);
 return `<div class="tabs">${['Modrinth','CurseForge'].map(x=>`<button class="ghost ${D.src===x?'on':''}" data-src="${x}">${x}</button>`).join('')}</div>
<div class="row"><input type="text" placeholder="搜尋…"><select style="flex:.8" ${pk?'disabled':''}><option>安裝到：${inst}</option></select></div>
${filterRow(k)}
${pk?'':`<label style="display:flex;gap:6px;align-items:center;color:var(--text)"><input type="checkbox" id="dp2" style="accent-color:var(--accent)" ${D.deps?'checked':''}> 自動安裝前置（必要相依）</label>`}
<div class="list" style="margin-top:10px">${R[k].map(([n,d,o=[]])=>`<div class="it" style="display:block"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span data-open="${n}" style="cursor:pointer;flex:1">${n}<small>${D.src} · ${D.ver}${d.length?' · 必要前置：'+d.join('、'):''}</small></span><div style="display:flex;gap:6px"><button class="ghost" style="padding:5px 10px;font-size:12px" data-open="${n}">詳情</button><button class="btn sm" data-i="${n}">${pk?'安裝為新實例':'安裝'}</button></div></div>${o.length?`<div style="margin-top:6px;display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute)">可選前置：${o.map(x=>`<label style="display:flex;gap:4px;align-items:center;margin:0;color:var(--text)"><input type="checkbox" data-o="${n}|${x}" style="accent-color:var(--accent)" ${D.opt[n+'|'+x]?'checked':''}>${x}</label>`).join('')}</div>`:''}</div>`).join('')}</div>`}

const FC={mod:['優化','科技','食物','實用','世界生成','前置庫'],shader:['寫實','卡通','路徑追蹤','低配'],res:['原版風','實體','主題'],pack:['冒險','輕量','大雜燴','高難度']};
function filterRow(k){D.sort=D.sort||'rel';D.cat=D.cat||'';D.env=D.env||'';
 const sel=(id,l,opts,cur)=>`<label style="margin:0;display:flex;flex-direction:column;gap:2px;font-size:11px">${l}<select id="${id}" style="padding:4px 6px">${opts.map(([v,t])=>`<option value="${v}" ${cur===v?'selected':''}>${t}</option>`).join('')}</select></label>`;
 return `<div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0">${sel('fs','排序',[['rel','相關度'],['dl','下載數'],['fo','追蹤數'],['nw','最新發布'],['up','最近更新']],D.sort)}
 ${sel('fc','分類',[['','全部'],...FC[k].map(x=>[x,x])],D.cat)}
 ${k==='shader'?sel('fl','光影載入器',[['','全部'],['iris','Iris'],['of','OptiFine'],['cv','Canvas']],D.fl||''):k==='res'?'':sel('fl','載入器',[['','全部'],['fabric','Fabric'],['forge','Forge'],['neoforge','NeoForge'],['quilt','Quilt']],D.fl===undefined?(k==='mod'?'neoforge':''):D.fl)}
 ${(k==='mod'||k==='pack')?sel('fe','執行端',[['','全部'],['client','客戶端可用'],['server','伺服器可用']],D.env):''}
 <label style="margin:0;display:flex;flex-direction:column;gap:2px;font-size:11px">MC 版本（空白＝全部）<input type="text" id="fv" value="${k==='pack'?'':D.ver}" style="padding:4px 6px;width:120px"></label></div>
 <div style="color:var(--mute);font-size:12px">共 ${R[k].length*12} 個結果，已顯示 ${R[k].length} 個（範例資料）</div>`}
D.inst=D.inst||{mod:[['sodium-neoforge-0.6.1.jar','1.2 MB',1],['lithium-neoforge-0.14.jar','640 KB',1],['jei-1.21.1.jar','3.4 MB',0],['create-6.0.jar','18 MB',1]],
 shader:[['ComplementaryReimagined.zip','1.1 MB',1],['BSL_v8.zip','800 KB',1]],res:[['Faithful32x.zip','9.5 MB',1]]};
D.ik=D.ik||'mod';D.upd=D.upd||{};
function instTab(){const L=D.inst[D.ik],n=Object.keys(D.upd).length;
 return `<div class="row"><select id="ik" style="flex:.4">${[['mod','模組'],['shader','光影'],['res','資源包']].map(([v,t])=>`<option value="${v}" ${D.ik===v?'selected':''}>${t}</option>`).join('')}</select><span style="flex:1"></span>
 <button class="ghost" data-folder="1">開啟資料夾</button><button class="ghost" data-chk="1">檢查更新</button><button class="btn sm" data-upall="1" ${n?'':'disabled style="opacity:.4"'}>全部更新</button></div>
 <div class="list" style="margin-top:10px">${L.map((x,i)=>`<div class="it" style="display:flex;align-items:center;gap:8px"><input type="checkbox" data-tg="${i}" ${x[2]?'checked':''} style="accent-color:var(--accent)"><span style="flex:1;${x[2]?'':'text-decoration:line-through;color:var(--mute)'}">${x[0]}</span>
 <span style="color:var(--accent);font-size:12px">${D.upd[x[0]]?'可更新 → '+D.upd[x[0]]:''}</span><small style="color:var(--mute)">${x[1]}</small><button class="ghost" style="padding:4px 8px;font-size:12px" data-del="${i}">刪除</button></div>`).join('')||'<div class="it">沒有檔案</div>'}</div>
 <div style="color:var(--mute);font-size:12px;margin-top:8px">取消勾選＝停用（檔名加 .disabled，不會刪除）。只比對正式版。</div>`}
function bindInst(e){const t=e.target;
 if(t.id==='ik'){D.ik=t.value;D.upd={};render();return true}
 if(t.dataset&&t.dataset.tg!==undefined){D.inst[D.ik][+t.dataset.tg][2]=t.checked?1:0;render();return true}
 if(['fs','fc','fl','fe'].includes(t.id)){D[{fs:'sort',fc:'cat',fl:'fl',fe:'env'}[t.id]]=t.value;toast('已套用篩選（預覽）');render();return true}}
function instMsg(n,v){const it=R[D.tab].find(x=>x[0]===n),d=it[1],o=(it[2]||[]).filter(x=>D.opt[n+'|'+x]);toast(D.tab==='pack'?'已建立新實例：'+n:'已安裝：'+n+(v?' '+v:'')+(d.length?(D.deps?' ＋ 前置 '+d.join('、'):' ⚠ 未裝前置'):'')+(o.length?' ＋ 可選 '+o.join('、'):'')+'（預覽）')}
function bindDl(){const st=$('#stage');st.onchange=e=>{if(bindInst(e))return;const i=e.target.id;if(e.target.dataset.o){D.opt[e.target.dataset.o]=e.target.checked;return}if(i==='vf'){D.vf=e.target.checked;render();return}if(i==='fa'){D.fapi=e.target.checked;render()}else if(i==='dp2')D.deps=e.target.checked;else if(i==='dv'){D.lv=e.target.value;render()}};st.onclick=e=>{const t=e.target;
 const q=(a)=>t.closest(`[${a}]`);let m;
 if(m=q('data-del')){D.inst[D.ik].splice(+m.dataset.del,1);render()}else if(q('data-chk')){D.upd=D.ik==='mod'?{'sodium-neoforge-0.6.1.jar':'0.6.5','lithium-neoforge-0.14.jar':'0.15'}:{};toast(Object.keys(D.upd).length?'有 '+Object.keys(D.upd).length+' 個可更新':'全部都是最新版');render()}else if(q('data-upall')){D.upd={};toast('已更新完成（預覽）');render()}else if(q('data-folder')){toast('開啟資料夾（預覽）')}
 else if(m=q('data-tab')){D.tab=m.dataset.tab;D.open=null;render()}else if(m=q('data-f')){D.filt=m.dataset.f;D.ver=V.find(v=>v[2]===D.filt)[0];D.ld=D.filt==='r'?'NeoForge':'原版';render()}
 else if(m=q('data-v')){D.ver=m.dataset.v;render()}else if(m=q('data-src')){D.src=m.dataset.src;render()}else if(m=q('data-i')){instMsg(m.dataset.i)}else if(m=q('data-open')){D.open=m.dataset.open;D.pv=null;render()}else if(q('data-back')){D.open=null;render()}else if(m=q('data-pv')){D.pv=+m.dataset.pv;render()}else if(q('data-idet')){instMsg(D.open,'v2.'+(6-D.pv)+'.'+(D.pv%2))}
 else if(t.id==='di'){let p=0;const h=setInterval(()=>{p+=10;$('#dp').style.width=p+'%';if(p>=100){clearInterval(h);inst=$('#dn').value;$('#iname').textContent=inst;$('#imeta').textContent=D.ver+' · '+D.ld+(D.ld!=='原版'?' '+D.lv:'');toast('已建立實例並設為目前實例')}},150)}};
 const sel=$('#dl');if(sel)sel.onchange=()=>{D.ld=sel.value;render()}}
function pP2P(){return head('P2P 連線（陶瓦聯機）')+`<div class="row"><div><label style="margin-top:0">玩家名</label><input type="text" value="TestPlayer"></div></div>
<div class="row" style="margin-top:12px"><button class="btn" data-t="開房中…（預覽）">開房（我是房主）</button><button class="ghost" data-t="加入中…（預覽）">加入房間</button></div>
<label>房間碼</label><input type="text" placeholder="U/XXXX-XXXX-XXXX-XXXX"><div class="list" style="margin-top:12px"><div class="it"><span>狀態<small>待機</small></span></div></div>
<div class="cr">陶瓦聯機 Terracotta © burningtnt（AGPL-3.0）。本啟動器只下載未修改的官方執行檔，並透過 HTTP API 互動。</div>`}
function pMore(){return head('更多')+`<div class="list">${['伺服器查找','遊戲日誌','種子地圖','帳號管理','EasyTier 房間（進階）'].map(n=>`<div class="it" data-t="${n}（預覽）">${n}<span style="color:var(--mute)">›</span></div>`).join('')}</div>`}
function pMusic(){return head('音樂')+`<div style="font-size:15px;margin-bottom:10px">♪ C418 – Sweden</div><div class="bar"><i style="width:35%"></i></div>
<div class="row" style="margin:12px 0"><button class="ghost" data-t="上一首">⏮</button><button class="btn" data-t="播放／暫停">⏯</button><button class="ghost" data-t="下一首">⏭</button></div>
<label>音量</label><input type="range" min="0" max="100" value="70" style="width:100%;accent-color:var(--accent)"><div style="margin-top:12px"><button class="ghost" data-t="選擇音樂資料夾（預覽）">📁 音樂資料夾</button></div>`}
home();
</script>
